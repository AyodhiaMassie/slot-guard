name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      # This credential belongs only to the job's disposable PostgreSQL service.
      TEST_DATABASE_URL: postgresql://slotguard:ci-only-password@127.0.0.1:5432/slotguard_ci_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: slotguard
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: slotguard_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotguard -d slotguard_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Migrate and seed the isolated test database
        run: npm run db:prepare:test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build both workspaces
        run: npm run build
      - name: Test backend units
        run: npm run test:unit
      - name: Test API, database constraints, and concurrent booking
        run: npm run test:integration
      - name: Test frontend units and components
        run: npm run test:client
